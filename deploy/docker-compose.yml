# Local FHIR R4 server for Phase E — HAPI FHIR JPA.
#
#   docker compose -f deploy/docker-compose.yml up -d
#   bash scripts/load-profile.sh          # push the ProhoriPatient StructureDefinition
#   # point the app + dashboard at it:
#   Fhir__BaseUrl=http://localhost:8080/fhir dotnet run --project src/Prohori.Api
#   VITE_FHIR_BASE=http://localhost:8080/fhir  (web/.env)
#
# Storage: HAPI's default embedded H2, persisted to the hapi-data volume. Wipe
# with `docker compose ... down -v`. (Postgres + HAPI v8's bundled Flyway reject
# modern Postgres versions — not worth fighting for a local dev server.)
name: prohori

services:
  hapi:
    image: hapiproject/hapi:v8.0.0
    # so the container can write the H2 file on the named volume
    user: root
    ports:
      - "8080:8080"
    environment:
      # Layer these on top of HAPI's bundled application.yaml (keeps the H2 default).
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:///app/config/application.yaml
      spring.datasource.url: jdbc:h2:file:/data/h2;DB_CLOSE_DELAY=-1
    configs:
      - source: hapi-overrides
        target: /app/config/application.yaml
    volumes:
      - hapi-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/fhir/metadata"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 90s

configs:
  hapi-overrides:
    file: ./hapi/application.yaml

volumes:
  hapi-data:
