# Overrides layered on top of HAPI's bundled config (SPRING_CONFIG_ADDITIONAL_LOCATION).
hapi:
  fhir:
    allow_multiple_delete: true
    allow_external_references: true

    cors:
      allowed_origin:
        - "*"

    # Validate every write against the resource's declared meta.profile.
    # Load the ProhoriPatient StructureDefinition first: bash scripts/load-profile.sh
    validation:
      requests_enabled: true
      responses_enabled: false
