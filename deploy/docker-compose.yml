# Local FHIR R4 server for Phase E — HAPI FHIR JPA + Postgres.
#
#   docker compose -f deploy/docker-compose.yml up -d
#   bash scripts/load-profile.sh          # push the ProhoriPatient StructureDefinition
#   # point the app + dashboard at it:
#   Fhir__BaseUrl=http://localhost:8080/fhir dotnet run --project src/Prohori.Api
#   VITE_FHIR_BASE=http://localhost:8080/fhir  (web/.env)
#
name: prohori

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hapi
      POSTGRES_USER: hapi
      POSTGRES_PASSWORD: hapi
    volumes:
      - hapi-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hapi -d hapi"]
      interval: 5s
      timeout: 5s
      retries: 20

  hapi:
    image: hapiproject/hapi:v8.0.0
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    configs:
      - source: hapi-application
        target: /app/config/application.yaml
    environment:
      SPRING_CONFIG_LOCATION: file:///app/config/application.yaml
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/fhir/metadata"]
      interval: 10s
      timeout: 5s
      retries: 30

configs:
  hapi-application:
    file: ./hapi/application.yaml

volumes:
  hapi-pgdata:
