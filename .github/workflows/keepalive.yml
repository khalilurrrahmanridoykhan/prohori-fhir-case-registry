name: keepalive

# Render's free web service sleeps after 15 min idle. Ping it so the live demo
# is warm. Set the repo variable RENDER_API_URL (Settings > Secrets and variables
# > Actions > Variables) to your Render URL; skips cleanly until then.
on:
  schedule:
    - cron: "*/13 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the API health endpoint
        run: |
          URL="${{ vars.RENDER_API_URL }}"
          if [ -z "$URL" ]; then echo "RENDER_API_URL not set — skipping"; exit 0; fi
          curl -sfS --max-time 30 "$URL/health" && echo " — awake" || echo "ping failed (will retry next run)"
