name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  bulk:
    name: Bulk Data — real Keycloak + HAPI export
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Verify RS384 authentication, full export and incremental export
        run: bash scripts/verify-bulk.sh
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: bulk-export-evidence
          path: .bulk/evidence/*.json
      - name: Container diagnostics on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.bulk.yml logs --tail 100
      - name: Stop isolated lab
        if: always()
        run: docker compose -f deploy/docker-compose.bulk.yml down -v

  build-test:
    name: build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - name: Unit tests (excludes Category=Integration)
        run: >
          dotnet test --no-build -c Release
          --filter "Category!=Integration"
          --logger "trx;LogFileName=unit.trx"
          --results-directory TestResults

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/*.trx

  web:
    name: dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test

  ig:
    name: IG — build profile + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm install -g fsh-sushi
      - name: Generate the FHIR profile from FSH
        run: cd ig && sushi . --snapshot
      - name: Validate the profile against the expectation fixtures
        run: bash scripts/validate-ig.sh

  bd-core:
    name: BD-Core — build Bundle + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: dotnet build -c Release src/Prohori.Api
      - name: Build the BD-Core Bundle and validate against bd.fhir.core
        run: bash scripts/bd-core.sh   # no --submit in CI

  sdc:
    name: SDC — build Questionnaire + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: dotnet build -c Release src/Prohori.Api
      - name: Build the Questionnaire and validate against base FHIR R4
        run: bash scripts/validate-questionnaire.sh

  terminology:
    name: Terminology — expand, validate-code, translate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g fsh-sushi
      - name: Generate the terminology resources from FSH
        run: cd ig && sushi . --snapshot
      - name: Start local HAPI
        run: docker compose -f deploy/docker-compose.yml up -d hapi
      - name: Wait for HAPI
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/fhir/metadata)
            [ "$code" = "200" ] && exit 0
            sleep 3
          done
          echo "HAPI never became ready" >&2; exit 1
      - name: Load CodeSystem / ValueSets / ConceptMap
        run: bash scripts/load-terminology.sh
      - name: '$expand / $validate-code / $translate against local HAPI'
        run: bash scripts/verify-terminology.sh
      - name: Container diagnostics on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs hapi --tail 100
      - name: Stop local HAPI
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v

  integration:
    name: integration tests (sandbox, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - name: Integration tests against hapi.fhir.org
        run: dotnet test --no-build -c Release --filter "Category=Integration"
